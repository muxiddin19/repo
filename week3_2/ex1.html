<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" >
        <style>
            .card {
                width: 200px;
                height: 180px;
                background: white;
                border: 2px solid teal;
                border-radius: 12px;
                position: relative;
                margin: 40px;
            }
            .badge {
                position: absolute;
                top: -12px;
                right: 16px;
                background: #0f766e;
                color: white;
                font-size: 12px;
                font-weight: bold;
                padding: 4px 12px;
                border-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <span class="badge">Sale</span>
            <p style="padding: 16px; color: #0f766e; font-weight: bold;">Card content here</p>
        </div>
    </body>
</html>
