<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  :root {
    --primary: #0f766e; --accent: #14b8a6;
    --bg: #f0fdfa;      --text: #1e293b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #051a0a; --text: #d4edda; }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: sans-serif; padding: 24px; }
  h1 { color: var(--primary); margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  .card {
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    font-size: 15px;
    font-weight: 600;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 28px rgba(15,118,110,0.18);
  }
  .card[data-icon]::before {
    content: attr(data-icon);
    display: block;
    font-size: 2.2rem;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <h1>My Skills</h1>
  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>
</body>
</html>
