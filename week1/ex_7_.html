<h1>How to make Ramen</h1>
<h2>Ingredients</h2>
<ul>
    <li>1 ramen packet</li>
    <li>500 ml water</li>
    <li>1 egg (optional)</li>
</ul>
<h2>Steps</h2>
<ol>
    <li>Boil thewater in a pot</li>
    <li>Add the noodles - cook for <strong>3 minutes</strong>.</li>
    <li>Add the seasoning packet and stir <em>vigorously</em>.</li>
    <li>Optionally crack in an egg and wait 30 seconds.</li>
    <li> Serve immediately.</li>
</ol>
