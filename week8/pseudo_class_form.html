<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Pseudo-classes for forms</title>
        <style>
             /* Green border ehen valid */
            input:valid {
                border: 2px solid #27C93F;
            }
            /*Red border + icon when invalid */
            input:invalid {
                border: 2px solid #ff5f56;
                background: url("x.svg")
                no-repeat right 0.5rem center;
            }
            /* Focus ring for keyboard nav */
            input:focus {
                outline: 3px solid #F7DF1E;
                outline-offset: 2px;
            }
            /* Hide error until touched */
            input:placeholder-shown {border: none;}
        </style>
    </head>

</html>
