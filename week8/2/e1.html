<!DOCTYPE html>
<html><head>
<style>
  body { font-family: system-ui; padding: 28px; max-width: 380px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 10px 14px; border: 2px solid #c8d4f0;
    border-radius: 8px; font-size: 14px; margin-bottom: 4px; }
  input:focus { border-color: #1a56db; outline: none; }
  .error { color: #dc2626; font-size: 12px; font-weight: 600; min-height: 16px; }
  .success { color: #16a34a; font-size: 15px; font-weight: 700; margin-top: 12px; }
  button { background: #1a56db; color: #fff; border: none;
    padding: 11px 24px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; margin-top: 12px; }
</style>
</head><body>
<h2>Login Demo</h2>
<form id="login-form">
  <label for="uname">Username</label>
  <input type="text" id="uname" placeholder="Enter username">
  <span class="error" id="uname-error"></span>
  <button type="submit">Log In</button>
</form>
<div class="success" id="success-msg"></div>

<script>
  // YOUR CODE HERE
  // 1. Select #login-form, #uname, #uname-error, #success-msg
  // 2. Add 'submit' listener to the form
  // 3. Call e.preventDefault()
  // 4. If #uname.value.trim() is empty: show error, clear success
  // 5. Otherwise: show success message, clear error
const form    = document.querySelector('#login-form');
const uname   = document.querySelector('#uname');
const errEl   = document.querySelector('#uname-error');
const success = document.querySelector('#success-msg');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const val = uname.value.trim();
  if (!val) {
    errEl.textContent = 'Username is required.';
    success.textContent = '';
  } else {
    errEl.textContent = '';
    success.textContent = `Welcome, ${val}!`;
  }
});

</script>
