<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form — 4 Fields</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px 24px;
      max-width: 420px;
      margin: 0 auto;
      background: #f8fafc;
      color: #0f172a;
    }
    h2 { font-size: 1.2rem; margin-bottom: 24px; }

    .field-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px 13px;
      font-size: 14px;
      border: 2px solid #c8d4f0;
      border-radius: 8px;
      outline: none;
      box-sizing: border-box;
      transition: border-color .2s, background .2s;
      font-family: inherit;
    }
    input:focus                { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    input[aria-invalid="true"] { border-color: #ef4444; background: #fef2f2; }
    input.valid                { border-color: #22c55e; background: #f0fdf4; }

    .err {
      display: block;
      font-size: 12px;
      color: #dc2626;
      margin-top: 5px;
      min-height: 16px;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 6px;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    button[type="submit"]:hover    { background: #1d4ed8; }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

    #success {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      background: #f0fdf4;
      border: 2px solid #22c55e;
      border-radius: 8px;
      font-size: 14px;
      color: #15803d;
      font-weight: 600;
    }
  </style>
</head>
<body>

<h2>Student Registration</h2>

<form id="regForm" action="#" method="post" novalidate>

  <div class="field-group">
    <label for="sid">Student ID</label>
    <input type="text" id="sid" name="sid"
      required placeholder="9-digit number"
      aria-describedby="sid-err" aria-invalid="false">
    <span id="sid-err" class="err" role="alert"></span>
  </div>

  <div class="field-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email"
      required placeholder="name@example.com"
      aria-describedby="email-err" aria-invalid="false">
    <span id="email-err" class="err" role="alert"></span>
  </div>

  <div class="field-group">
    <label for="pw">Password</label>
    <input type="password" id="pw" name="pw"
      required minlength="8" placeholder="At least 8 characters"
      aria-describedby="pw-err" aria-invalid="false">
    <span id="pw-err" class="err" role="alert"></span>
  </div>

  <div class="field-group">
    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone"
      required placeholder="010-1234-5678"
      aria-describedby="phone-err" aria-invalid="false">
    <span id="phone-err" class="err" role="alert"></span>
  </div>

  <button type="submit" id="submit-btn" disabled>Register</button>
</form>

<div id="success">✅ Registration complete!</div>

<script>
  // Field references
  const form     = document.getElementById('regForm');
  const sid      = document.getElementById('sid');
  const email    = document.getElementById('email');
  const pw       = document.getElementById('pw');
  const phone    = document.getElementById('phone');
  const submitBtn = document.getElementById('submit-btn');

  // Patterns
  const SID_PATTERN   = /^\d{9}$/;
  const PHONE_PATTERN = /^\d{3}-\d{4}-\d{4}$/;

  // Generic helper: empty msg = valid, non-empty = invalid
  function setErr(input, errId, msg) {
    document.getElementById(errId).textContent = msg;
    if (msg) {
      input.setAttribute('aria-invalid', 'true');
      input.classList.remove('valid');
    } else {
      input.setAttribute('aria-invalid', 'false');
      if (input.value) input.classList.add('valid');
    }
  }

  // Per-field validators
  function validateSid() {
    if (sid.validity.valueMissing)         setErr(sid,   'sid-err',   'Required.');
    else if (!SID_PATTERN.test(sid.value)) setErr(sid,   'sid-err',   'Exactly 9 digits.');
    else                                   setErr(sid,   'sid-err',   '');
  }

  function validateEmail() {
    if (email.validity.valueMissing)       setErr(email, 'email-err', 'Required.');
    else if (email.validity.typeMismatch)  setErr(email, 'email-err', 'Valid email required.');
    else                                   setErr(email, 'email-err', '');
  }

  function validatePw() {
    if (pw.validity.valueMissing)          setErr(pw,    'pw-err',    'Required.');
    else if (pw.validity.tooShort)         setErr(pw,    'pw-err',    'Min. 8 characters.');
    else                                   setErr(pw,    'pw-err',    '');
  }

  function validatePhone() {
    if (!PHONE_PATTERN.test(phone.value))  setErr(phone, 'phone-err', 'Format: 010-1234-5678');
    else                                   setErr(phone, 'phone-err', '');
  }

  // BONUS: enable submit only when every field passes
  function updateSubmitState() {
    const allValid = [sid, email, pw].every(f => f.validity.valid)
      && PHONE_PATTERN.test(phone.value);
    submitBtn.disabled = !allValid;
  }

  // Wire: validate field + update submit on every keystroke
  [
    [sid,   validateSid],
    [email, validateEmail],
    [pw,    validatePw],
    [phone, validatePhone]
  ].forEach(([el, fn]) => {
    el.addEventListener('input', () => { fn(); updateSubmitState(); });
  });

  // Submit gate
  form.addEventListener('submit', e => {
    e.preventDefault();
    validateSid(); validateEmail(); validatePw(); validatePhone();
    if (!submitBtn.disabled) {
      form.style.display = 'none';
      document.getElementById('success').style.display = 'block';
    }
  });
</script>
</body>
</html>
