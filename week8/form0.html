<!-- Basic form skeleton -->
<form
  action="/register"
  method="POST"
  id="reg-form"
  autocomplete="on">

  <label for="name">Full Name</label>
  <input type="text" id="name" name="name"><br><br>

  <label for="email">Email</label>
  <input type="email" id="email" name="email"><br><br>

  <button type="submit">Register</button>
</form>
