<!-- Grouping personal info -->
<fieldset>
  <legend>Personal Information</legend>

<label for="name">Full Name</label>
  <input type="text" id="name" name="name" required><br><br>

  <label for="brt">Bithrday</label>
  <input type="date" id="brt" name="birth" required><br><br>

  <label for="age">Age</label>
  <input type="number" id="age" name="age" required max="99" min="18"><br><br>
</fieldset>
<br><br>

<fieldset>
  <legend>Contact Details</legend>
  <label for="sid">Student ID</label>
  <input type="number" id="sid" name="student id" required pattern="\d{9}" title="type your student id within 9 digits" step="100" placeholder="student id 9 digits"><br><br>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="username@gachon.edu" required><br><br>

  <label for="pw">Password</label>
  <input type="password" id="pw" name="password" required minlength="8"><br><br>

</fieldset>
