    <h2>On the Web</h2>
    <p> The inventor of the web described his vision clearly:</p>
    <blockquote cite="https://www.w3.org/People/Berners-Lee/FAQ.html">
        <p>The original idea of the web was that it should be a colloborative space where you can communicate through sharing information.</p>
        <footer>
            - <cite>Tim Berners-Lee</cite>, W3C Director

        </footer>
    </blockquote>
    <p>Today, his vision has expanded beyond what even he imagined.</p>
