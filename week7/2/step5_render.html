<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 5 — Render: Display the Cards</title>
<style>
:root{--dark:#1a2540;--accent:#1a56db;--bg:#f0f4ff;--surf:#fff;--border:#c8d4f0;--text:#1a2340;--muted:#5a6a8a;--red:#dc2626;--redl:#fee2e2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--dark);padding:32px;text-align:center}
header h1{color:#fff;font-size:24px;font-weight:800}
header p{color:#94a3b8;font-size:14px;margin-top:6px}
#search-section{max-width:600px;margin:32px auto;padding:0 20px}
form{display:flex;gap:10px}
input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit}
button{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#1447b3}
#results-section{max-width:1000px;margin:0 auto;padding:0 20px 60px}
#results-section h2{font-size:18px;font-weight:700;margin-bottom:8px}
#status{font-size:13px;color:var(--muted);margin-bottom:16px}
#status.error{color:var(--red)}
#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
.book-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:pointer}
.book-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(26,37,64,.14)}
.book-card img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#e2e8f0}
.book-card .no-cover{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#e2e8f0,#c8d4f0);display:flex;align-items:center;justify-content:center;font-size:36px}
.card-body{padding:10px 12px 14px}
.card-body h3{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-body p{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<header>
  <h1>📚 Book Search</h1>
  <p>Search the Open Library — millions of books, free</p>
</header>

<main>
  <section id="search-section">
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search books…" required>
      <button type="submit">Search</button>
    </form>
  </section>

  <section id="results-section">
    <h2>Results</h2>
    <p id="status">Type a title or author above and press Search.</p>
    <div id="results-grid"></div>
  </section>
</main>

<script>
/*
  ╔══════════════════════════════════════════════════════╗
  ║  STEP 5 — Render: Display the Cards                 ║
  ║                                                      ║
  ║  The fetch code from Step 4 is done for you below.  ║
  ║  YOUR TASK: complete the renderResults() function.  ║
  ║                                                      ║
  ║  renderResults(books) receives an array of book     ║
  ║  objects. For each book you must:                   ║
  ║                                                      ║
  ║  1. Clear the grid (before the loop):               ║
  ║       grid.innerHTML = '';                           ║
  ║                                                      ║
  ║  2. Loop: books.forEach(book => { ... })            ║
  ║                                                      ║
  ║  3. Inside the loop, create a card:                 ║
  ║                                                      ║
  ║     a) const card = document.createElement('div');  ║
  ║        card.className = 'book-card';                ║
  ║                                                      ║
  ║     b) Build the cover image HTML:                  ║
  ║        if book.cover_i exists:                      ║
  ║          const coverUrl =                           ║
  ║            'https://covers.openlibrary.org/b/id/'   ║
  ║            + book.cover_i + '-M.jpg';               ║
  ║          imgHtml = '<img src="' + coverUrl          ║
  ║                  + '" alt="cover" loading="lazy">'; ║
  ║        else:                                        ║
  ║          imgHtml = '<div class="no-cover">📚</div>';║
  ║                                                      ║
  ║     c) Build the card body:                         ║
  ║        const title = book.title || 'Unknown title'; ║
  ║        const author = book.author_name              ║
  ║                         ? book.author_name[0]       ║
  ║                         : 'Unknown author';         ║
  ║        const year = book.first_publish_year || '';  ║
  ║                                                      ║
  ║     d) Set card.innerHTML:                          ║
  ║        card.innerHTML = imgHtml +                   ║
  ║          '<div class="card-body">' +                ║
  ║          '<h3>' + title + '</h3>' +                 ║
  ║          '<p>' + author + (year?' · '+year:'') + '</p>' +
  ║          '</div>';                                  ║
  ║                                                      ║
  ║     e) Append to grid:                              ║
  ║        grid.appendChild(card);                      ║
  ║                                                      ║
  ║  DONE?  Search "Harry Potter" — you should see a   ║
  ║  grid of book covers with titles and authors.       ║
  ║                                                      ║
  ║  ── IMPORTANT SECURITY NOTE ─────────────────────  ║
  ║  We are using innerHTML to set the card content.   ║
  ║  This is safe here ONLY because the data comes     ║
  ║  from a trusted API (openlibrary.org) — not from   ║
  ║  user input. If this were user input, we would     ║
  ║  use textContent instead (XSS risk!).              ║
  ╚══════════════════════════════════════════════════════╝
*/

const form   = document.getElementById('search-form');
const input  = document.getElementById('search-input');
const status = document.getElementById('status');
const grid   = document.getElementById('results-grid');

function renderResults(books) {
  // YOUR CODE HERE
}

async function searchBooks(query) {
  status.className = '';
  status.textContent = 'Searching…';
  grid.innerHTML = '';

  try {
    const url = 'https://openlibrary.org/search.json?q='
              + encodeURIComponent(query) + '&limit=12';
    const res = await fetch(url);
    if (!res.ok) throw new Error('Server error: ' + res.status);
    const data = await res.json();

    if (data.docs.length === 0) {
      status.textContent = 'No books found for "' + query + '"';
      return;
    }

    status.textContent = 'Showing ' + data.docs.length
                       + ' of ' + data.numFound + ' results for "'
                       + query + '"';

    renderResults(data.docs);  // ← calls your function

  } catch (err) {
    status.className = 'error';
    status.textContent = '⚠ ' + err.message;
  }
}

form.addEventListener('submit', function(e) {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  searchBooks(query);
});
</script>
</body>
</html>
