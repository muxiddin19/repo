<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📚 Book Search — Complete Solution</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --dark:#1a2540;--accent:#1a56db;--accent-hover:#1447b3;
  --bg:#f0f4ff;--surf:#fff;--border:#c8d4f0;
  --text:#1a2340;--muted:#5a6a8a;
  --red:#dc2626;--redl:#fee2e2;
  --yellow:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
header{background:var(--dark);padding:40px 24px 32px;text-align:center}
header h1{color:#fff;font-size:28px;font-weight:800;letter-spacing:-.01em}
header p{color:#94a3b8;font-size:14px;margin-top:8px}

/* ── Search ── */
#search-section{max-width:620px;margin:36px auto;padding:0 20px}
form{display:flex;gap:10px}
input{flex:1;padding:13px 18px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;padding:13px 26px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
button:hover:not(:disabled){background:var(--accent-hover)}
button:disabled{opacity:.6;cursor:not-allowed}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Results ── */
#results-section{max-width:1060px;margin:0 auto;padding:0 20px 60px}
#results-section h2{font-size:18px;font-weight:700;margin-bottom:10px}

/* Status bar */
#status{font-size:13px;margin-bottom:18px;padding:10px 14px;border-radius:8px;display:none}
#status.info {display:block;background:var(--surf);border:1px solid var(--border);color:var(--muted)}
#status.error{display:block;background:var(--redl);border:1px solid var(--red);color:var(--red)}
#status.empty{display:block;background:#fefce8;border:1px solid var(--yellow);color:#92400e}

/* Grid */
#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}

/* Book card */
.book-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.book-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,37,64,.15)}
.book-card img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#e2e8f0}
.no-cover{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#e2e8f0,#c8d4f0);display:flex;align-items:center;justify-content:center;font-size:40px}
.card-body{padding:10px 12px 14px}
.card-body h3{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-body p{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Skeleton loading */
.skeleton{background:var(--surf);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.skel-img{width:100%;aspect-ratio:2/3;background:#e2e8f0}
.skel-body{padding:10px 12px 14px}
.skel-line{height:11px;background:#e2e8f0;border-radius:4px;margin-bottom:8px}
.skel-line.s{width:55%}
</style>
</head>
<body>

<header>
  <h1>📚 Book Search</h1>
  <p>Search the Open Library — millions of books, free</p>
</header>

<main>
  <section id="search-section">
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search by title, author or subject…" required>
      <button id="search-btn" type="submit">Search</button>
    </form>
  </section>

  <section id="results-section">
    <h2>Results</h2>
    <div id="status"></div>
    <div id="results-grid"></div>
  </section>
</main>

<script>
// ── DOM references ────────────────────────────────────────
const form   = document.getElementById('search-form');
const input  = document.getElementById('search-input');
const status = document.getElementById('status');
const grid   = document.getElementById('results-grid');
const btn    = document.getElementById('search-btn');

// ── Helpers ───────────────────────────────────────────────
function setStatus(type, msg) {
  status.className = type;
  status.textContent = msg;
}

function showSkeletons() {
  grid.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const sk = document.createElement('div');
    sk.className = 'skeleton';
    sk.innerHTML =
      '<div class="skel-img"></div>' +
      '<div class="skel-body">' +
        '<div class="skel-line"></div>' +
        '<div class="skel-line s"></div>' +
      '</div>';
    grid.appendChild(sk);
  }
}

function renderResults(books) {
  grid.innerHTML = '';
  books.forEach(book => {
    const card = document.createElement('div');
    card.className = 'book-card';

    const imgHtml = book.cover_i
      ? '<img src="https://covers.openlibrary.org/b/id/'
          + book.cover_i + '-M.jpg" alt="cover" loading="lazy">'
      : '<div class="no-cover">📚</div>';

    const title  = book.title || 'Unknown title';
    const author = book.author_name ? book.author_name[0] : 'Unknown author';
    const year   = book.first_publish_year || '';

    // innerHTML is safe here because data comes from a trusted API
    card.innerHTML = imgHtml +
      '<div class="card-body">' +
        '<h3>' + title + '</h3>' +
        '<p>' + author + (year ? ' · ' + year : '') + '</p>' +
      '</div>';

    grid.appendChild(card);
  });
}

// ── Main fetch function ───────────────────────────────────
async function searchBooks(query) {
  // Disable button + show spinner
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Searching…';

  showSkeletons();
  setStatus('info', 'Fetching results from Open Library…');

  try {
    const url = 'https://openlibrary.org/search.json?q='
              + encodeURIComponent(query) + '&limit=12';

    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP error ' + res.status);

    const data = await res.json();

    if (data.docs.length === 0) {
      setStatus('empty', '📭 No books found for "' + query
              + '" — try a different title or author name.');
      grid.innerHTML = '';
      return;
    }

    setStatus('info', 'Showing ' + data.docs.length
                    + ' of ' + data.numFound.toLocaleString()
                    + ' results for "' + query + '"');
    renderResults(data.docs);

  } catch (err) {
    grid.innerHTML = '';
    setStatus('error', '⚠ ' + err.message
            + ' — check your internet connection and try again.');
  } finally {
    // Always re-enable the button
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

// ── Event listener ────────────────────────────────────────
form.addEventListener('submit', function(e) {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  searchBooks(query);
});
</script>
</body>
</html>
