<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px">
  <h2 id="msg">Original Text</h2>
  <input id="inp" type="text" placeholder="Type new text..." style="padding:8px;font-size:16px;width:200px">
  <button onclick="changeText()" style="padding:8px 16px;margin-left:8px;cursor:pointer">
    Change Text
  </button>
  <script>
    function changeText() {
      const newText = document.getElementById('inp').value;
      // textContent treats HTML tags as plain text (safe!)
      document.getElementById('msg').textContent = newText;
    }
  </script>
</body></html>
