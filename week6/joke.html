<!DOCTYPE html>
<body style="font-family:system-ui;padding:2rem;max-width:500px;margin:0 auto">
  <h2 id="setup">Loading joke...</h2>
  <p id="punchline" style="color:#666;font-style:italic"></p>
  <button onclick="fetchJoke()">New Joke</button>

  <script>
    async function fetchJoke() {
      document.getElementById('setup').textContent = 'Loading...';
      document.getElementById('punchline').textContent = '';
      try {
        const res  = await fetch(
          'https://official-joke-api.appspot.com/random_joke');
        if (!res.ok) throw new Error('Status ' + res.status);
        const joke = await res.json();
        document.getElementById('setup').textContent     = joke.setup;
        document.getElementById('punchline').textContent = joke.punchline;
      } catch (err) {
        document.getElementById('setup').textContent = 'Error: ' + err.message;
      }
    }
    fetchJoke(); // load on open
  </script>
</body>
