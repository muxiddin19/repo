<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CSS demo</title>
        <style>
            body {
                font-family: sans-serif; background: #f0f9ff; color: #1e293b;
            }
            p {
                max-width: 60ch; line-height: 1.7;
            }
            h1 {
                color: #15803d; font-size: 2rem;
            }
        </style>
    </head>
    <body>
        <h1>Hello, CSS!</h1>
        <p>This heading is green and the background is light blue - all controlled by CSS, not HTML.</p>
    </body>
</html>
