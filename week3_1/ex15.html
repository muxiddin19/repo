<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <style>
            .left {text-align: left;}
            .centter {text-align: center;}
            .right {text-align: right;}
            .justify {text-align: justify;}

            div {
                border: 1px solid #cbd5e1;
                padding: 12px;
                margin: 8px 0;
                max-width: 500px;
                            }
            .centered-box {
                width: 300px;
                margin: 0 auto;
                background: #ecfdf5;
                padding: 20px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="left">text-align: left - default</div>
        <div class="right">text-align: right - right-aligned</div>
        <div class="center">text-align: center - centered text</div>
        <div class="justify">text-align: justify - The text in this paragraph is streached to reach both edges of the box, just like a newspaper column layout.</div>
        <div class="centered-box">This box is centered on the page using margin: 0 auto</div>

    </body>
</html>
