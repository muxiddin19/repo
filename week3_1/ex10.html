<!DOCTYPE html>
<html lang="en">
    <head>
        <meta char="UTF-8">
        <style>
            /* #RRGGBB - Red / Green / Blue, each 00-FF */
            .red {background-color: #FF0000;} 
            .green {
                background-color: #00FF00;
            }
            .blue {background-color: #0000FF;}
            .white {background-color: #FFFFFF;}
            .black {background-color: #000000;}
            .custom {background-color: #10b981;} /* emerald */
            .short-red {background-color: #f00;}
            div {padding: 8px 16px; margin: 4px; display: inline-block;}
        </style>
    </head>
    <body>
        <div class="red">#FF0000 Red</div>
        <div class="green">#00FF00 Green</div>
        <div class="blue">#0000FF Blue</div>
        <div class="white">#FFFFFF White</div>
        <div class="black">#000000 Black</div>
        <div class="custom">#10b981 Custom</div>
        <div class="short-red">#F00 (shorthand)</div>
    </body>
</html>
